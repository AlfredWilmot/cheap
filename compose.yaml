services:
  c-dev:
    hostname: c-dev
    container_name: c-dev
    image: local/c-dev

    # equivalent to running container with "-it"
    tty: true
    stdin_open: true

    build:
      context: .
      cache_from:
        - type=gha,scope=images,mode=max
      cache_to:
        - type=gha,scope=images
      dockerfile: .dockerfiles/debian.Dockerfile
      args:
        USER_ID: "${USER_ID}"
    volumes:
      - "${PWD}:/workdir"
